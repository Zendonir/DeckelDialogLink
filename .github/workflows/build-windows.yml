name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows build and installer
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Determine version
        id: meta
        shell: pwsh
        run: |
          $version = python -c "from deckellink.version import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            if ($tag -ne $version) { throw "Tag v$tag does not match deckellink.version ($version)" }
          }

      - name: Run tests (no serial hardware required)
        run: pytest -q

      - name: Build with PyInstaller (onedir)
        run: pyinstaller --noconfirm --clean deckellink.spec

      - name: Smoke test of the built executable
        shell: pwsh
        run: |
          $exe = "dist\DeckelLink\DeckelLink.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $p = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test","--data-dir","$env:RUNNER_TEMP\dl-smoke","--smoke-report","$env:RUNNER_TEMP\smoke.json" `
            -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\smoke.json"
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ steps.meta.outputs.version }}" installer\deckellink.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Test installer (silent install, smoke test, uninstall)
        shell: pwsh
        run: |
          $setup = "dist\installer\DeckelLink-${{ steps.meta.outputs.version }}-Setup-x64.exe"
          $dir = "$env:RUNNER_TEMP\dl-install"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)" }
          $exe = Join-Path $dir "DeckelLink.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable missing" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test","--data-dir","$env:RUNNER_TEMP\dl-installed","--smoke-report","$env:RUNNER_TEMP\installed.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\installed.json"
          if ($p.ExitCode -ne 0) { throw "Installed smoke test failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed with exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Executable still present after uninstall" }
          if (-not (Test-Path "$env:RUNNER_TEMP\dl-installed\received")) { throw "User data was removed by uninstall" }

      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item README.md, LICENSE, CHANGELOG.md dist\DeckelLink\
          Compress-Archive -Path dist\DeckelLink -DestinationPath "release\DeckelLink-$v-windows-x64.zip"
          Copy-Item "dist\installer\DeckelLink-$v-Setup-x64.exe" release\
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii release\SHA256SUMS.txt
          Get-Content release\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeckelLink-${{ steps.meta.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub release (tags v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Release notes from CHANGELOG
        run: python3 tools/release_notes.py "${{ needs.build.outputs.version }}" > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DeckelLink ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: ${{ startsWith(needs.build.outputs.version, '0.') }}
