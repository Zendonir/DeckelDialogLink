name: Rust

on:
  push:
    branches: ["**"]
    paths: ["rust/**", "src/deckellink/resources/profiles/**", "src/deckellink/nc/**", "src/deckellink/parameters/**", "src/deckellink/diagnostics/**", "src/deckellink/transfer/**", "README.md", "docs/**", "tools/rust_parity.py", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "src/deckellink/resources/profiles/**", "src/deckellink/nc/**", "src/deckellink/parameters/**", "src/deckellink/diagnostics/**", "src/deckellink/transfer/**", "README.md", "docs/**", "tools/rust_parity.py", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (stability lints, warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --all --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Upload Windows CLI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: deckellink-cli-windows
          path: rust/target/release/deckellink-cli.exe
          if-no-files-found: error
      - name: Upload Windows application
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: deckellink-windows
          path: rust/target/release/deckellink.exe
          if-no-files-found: error

  parity:
    name: Python/Rust parity (differential test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Build Rust CLI
        working-directory: rust
        run: cargo build --release --locked
      - name: Compare 3000 random cases
        run: python tools/rust_parity.py --cases 3000 --seed 11
