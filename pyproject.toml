[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deckellink"
dynamic = ["version"]
description = "NC-Programmübertragung zwischen Windows-PC und DECKEL FP2A mit DIALOG 11 über RS-232 (nur Datenübertragung)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DeckelLink Contributors" }]
keywords = ["cnc", "dnc", "rs232", "deckel", "dialog11", "serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Manufacturing",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
]
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyserial",
]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
deckellink = "deckellink.app:main"

[project.scripts]
deckellink-cli = "deckellink.app:main"

[tool.setuptools.dynamic]
version = { attr = "deckellink.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deckellink = ["resources/profiles/*.json", "resources/icons/*"]

# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"
markers = [
    "gui: tests that need a Qt application (run offscreen)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["deckellink"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT", "RET"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "RUF001", "RUF002", "RUF003",
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC2701", "PT018", "PLW0108"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["serial.*"]
ignore_missing_imports = true
